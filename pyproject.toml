[project]
name = "polars-investment-strategy"
version = "1.1.2"
description = "A modular Polars-based framework for factor investing strategy backtesting."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datetime>=6.0",
    "jupyter>=1.1.1",
    "lxml>=6.1.1",
    "pandas>=3.0.5",
    "polars>=1.43.0",
    "typing>=3.10.0.0",
    "yfinance>=1.5.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
